<meta charset="UTF-8" />

<title>محوّل العملات — أسعار صرف مباشرة</title>
<link rel="icon" href="data:," />
<meta name="description" content="حوّل بين ٢٠ عملة عالمية بأسعار صرف محدثة يوميًا." />

<style>
  :root {
    --bg: #f4f1ea;
    --card: #ffffff;
    --ink: #1b2432;
    --muted: #6b7484;
    --line: #e3ded3;
    --field: #f7f5f0;
    --accent: #0f5d52;
    --accent-ink: #ffffff;
    --accent-soft: #e6f0ed;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    background: var(--bg);
    color: var(--ink);
    font-family: "Tajawal", "Segoe UI", Tahoma, sans-serif;
  }
  .card {
    width: 100%;
    max-width: 420px;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 28px;
    padding: 26px;
    box-shadow: 0 24px 60px -28px rgba(27, 36, 50, 0.35);
  }
  h1 { margin: 0; font-size: 30px; font-weight: 800; letter-spacing: -0.5px; }
  .status { margin: 6px 0 0; font-size: 14px; color: var(--muted); }
  .status.error { color: #b3261e; }
  .body { margin-top: 22px; }
  .label { display: block; margin-bottom: 6px; font-size: 14px; color: var(--muted); }
  input[type="number"], select {
    width: 100%;
    border: 1px solid var(--line);
    background: var(--field);
    color: var(--ink);
    border-radius: 14px;
    padding: 12px 16px;
    font-family: inherit;
    font-size: 16px;
    outline: none;
    appearance: none;
    -webkit-appearance: none;
  }
  input[type="number"] { font-size: 26px; font-weight: 700; }
  input[type="number"]:focus, select:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
  select {
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='12' height='8' viewBox='0 0 12 8'><path d='M1 1l5 5 5-5' fill='none' stroke='%236b7484' stroke-width='2' stroke-linecap='round'/></svg>");
    background-repeat: no-repeat;
    background-position: left 14px center;
    padding-left: 36px;
  }
  .row { margin-bottom: 14px; }
  .swap {
    display: flex;
    margin: 4px auto 14px;
    width: 44px;
    height: 44px;
    border: none;
    border-radius: 50%;
    background: var(--accent);
    color: var(--accent-ink);
    font-size: 20px;
    cursor: pointer;
    align-items: center;
    justify-content: center;
    transition: transform 0.15s ease;
  }
  .swap:hover { transform: rotate(180deg); }
  .result {
    margin-top: 6px;
    background: var(--accent);
    color: var(--accent-ink);
    border-radius: 20px;
    padding: 20px;
  }
  .result .from { font-size: 14px; opacity: 0.85; }
  .result .to { margin-top: 4px; font-size: 32px; font-weight: 800; }
  .result .to span { font-size: 18px; font-weight: 500; opacity: 0.9; }
  .result .unit { margin-top: 8px; font-size: 12px; opacity: 0.85; }
  .hidden { display: none; }
</style>
</head>
<body>
  <main class="card">
    <h1>محوّل العملات</h1>
    <p class="status" id="status">جارٍ تحميل الأسعار...</p>

    <div class="body hidden" id="body">
      <div class="row">
        <label class="label" for="amount">المبلغ</label>
        <input type="number" id="amount" inputmode="decimal" value="100" />
      </div>

      <div class="row">
        <span class="label">من</span>
        <select id="from"></select>
      </div>

      <button class="swap" id="swap" aria-label="تبديل العملتين">⇅</button>

      <div class="row">
        <span class="label">إلى</span>
        <select id="to"></select>
      </div>

      <div class="result">
        <div class="from" id="fromLine"></div>
        <div class="to" id="toLine"></div>
        <div class="unit" id="unitLine"></div>
      </div>
    </div>
  </main>

<script>
  const NAMES = {
    USD: "دولار أمريكي", EUR: "يورو", GBP: "جنيه إسترليني", SAR: "ريال سعودي", AED: "درهم إماراتي",
    KWD: "دينار كويتي", QAR: "ريال قطري", BHD: "دينار بحريني", OMR: "ريال عماني", JOD: "دينار أردني",
    EGP: "جنيه مصري", ILS: "شيكل", TRY: "ليرة تركية", JPY: "ين ياباني", CNY: "يوان صيني",
    CHF: "فرنك سويسري", CAD: "دولار كندي", AUD: "دولار أسترالي", INR: "روبية هندية", MAD: "درهم مغربي",
  };

  const statusEl = document.getElementById("status");
  const bodyEl = document.getElementById("body");
  const amountEl = document.getElementById("amount");
  const fromEl = document.getElementById("from");
  const toEl = document.getElementById("to");
  const fromLine = document.getElementById("fromLine");
  const toLine = document.getElementById("toLine");
  const unitLine = document.getElementById("unitLine");

  let rates = null;

  const fmt = (v) => v.toLocaleString("en-US", { maximumFractionDigits: 4 });

  function render() {
    const n = parseFloat(amountEl.value) || 0;
    const rate = rates[toEl.value] / rates[fromEl.value];
    fromLine.textContent = `${fmt(n)} ${NAMES[fromEl.value]} =`;
    toLine.innerHTML = `${fmt(n * rate)} <span>${toEl.value}</span>`;
    unitLine.textContent = `1 ${fromEl.value} = ${fmt(rate)} ${toEl.value}`;
  }

  function fillSelects() {
    const codes = Object.keys(NAMES).filter((c) => rates[c]);
    const defaults = { [fromEl.id]: "USD", [toEl.id]: "SAR" };
    [fromEl, toEl].forEach((sel) => {
      const keep = sel.dataset.picked || defaults[sel.id];
      sel.innerHTML = codes.map((c) => `<option value="${c}">${c} — ${NAMES[c]}</option>`).join("");
      sel.value = codes.includes(keep) ? keep : codes[0];
    });
  }

  const FALLBACK = {"USD": 1, "AED": 3.6725, "AFN": 65.191561, "ALL": 80.986825, "AMD": 360.549336, "ANG": 1.79, "AOA": 926.51993, "ARS": 1545.3974, "AUD": 1.454069, "AWG": 1.79, "AZN": 1.700766, "BAM": 1.752006, "BBD": 2, "BDT": 124.570146, "BGN": 1.752006, "BHD": 0.376, "BIF": 3005.900604, "BMD": 1, "BND": 1.281545, "BOB": 12.106001, "BRL": 5.502723, "BSD": 1, "BTN": 94.113846, "BWP": 14.178983, "BYN": 2.986244, "BZD": 2, "CAD": 1.409364, "CDF": 2255.695367, "CHF": 0.819664, "CLF": 0.024651, "CLP": 974.378765, "CNH": 6.671958, "CNY": 6.690826, "COP": 3239.854719, "CRC": 454.257852, "CUP": 24, "CVE": 98.773891, "CZK": 21.787979, "DJF": 177.721, "DKK": 6.702042, "DOP": 60.515425, "DZD": 136.117514, "EGP": 53.902283, "ERN": 15, "ETB": 161.826252, "EUR": 0.895793, "FJD": 2.24055, "FKP": 0.747468, "FOK": 6.702021, "GBP": 0.747473, "GEL": 2.594967, "GGP": 0.747468, "GHS": 11.702983, "GIP": 0.747468, "GMD": 74.807095, "GNF": 8848.722468, "GTQ": 7.650933, "GYD": 209.859959, "HKD": 7.839588, "HNL": 26.905851, "HRK": 6.749303, "HTG": 131.094859, "HUF": 325.605867, "IDR": 18097.90284, "ILS": 3.192797, "IMP": 0.747468, "INR": 94.114483, "IQD": 1518.632282, "IRR": 1726408.509848, "ISK": 122.556906, "JEP": 0.747468, "JMD": 158.611615, "JOD": 0.709, "JPY": 158.318418, "KES": 129.920856, "KGS": 87.495891, "KHR": 4093.994051, "KID": 1.454049, "KMF": 440.698035, "KRW": 1355.382119, "KWD": 0.310519, "KYD": 0.833333, "KZT": 448.875314, "LAK": 22331.845772, "LBP": 89500, "LKR": 332.417077, "LRD": 170.229916, "LSL": 16.515495, "LYD": 6.419334, "MAD": 9.752566, "MDL": 17.896986, "MGA": 4570.659583, "MKD": 54.928103, "MMK": 2099.755132, "MNT": 3598.467123, "MOP": 8.074775, "MRU": 40.440187, "MUR": 46.947472, "MVR": 15.458446, "MWK": 1744.334042, "MXN": 18.652374, "MYR": 4.0559, "MZN": 63.738234, "NAD": 16.515495, "NGN": 1347.744892, "NIO": 36.83233, "NOK": 9.449481, "NPR": 150.582154, "NZD": 1.805034, "OMR": 0.384497, "PAB": 1, "PEN": 3.438038, "PGK": 4.517625, "PHP": 63.064627, "PKR": 276.577812, "PLN": 3.93681, "PYG": 6107.599103, "QAR": 3.64, "RON": 4.780908, "RSD": 104.981451, "RUB": 81.74451, "RWF": 1480.073131, "SAR": 3.75, "SBD": 7.962541, "SCR": 13.887308, "SDG": 510.185551, "SEK": 9.889244, "SGD": 1.281547, "SHP": 0.747468, "SLE": 23.035655, "SLL": 23035.654542, "SOS": 572.122983, "SRD": 37.653903, "SSP": 6036.064063, "STN": 21.946768, "SYP": 122.007937, "SZL": 16.515495, "THB": 33.548613, "TJS": 9.206787, "TMT": 3.501062, "TND": 3.003887, "TOP": 2.388058, "TRY": 50.172034, "TTD": 6.769241, "TVD": 1.454049, "TWD": 32.847015, "TZS": 2639.90628, "UAH": 45.382802, "UGX": 3987.664666, "UYU": 40.272307, "UZS": 11963.851922, "VES": 897.5383, "VND": 25602.593225, "VUV": 120.166877, "WST": 2.745201, "XAF": 587.59738, "XCD": 2.7, "XCG": 1.79, "XDR": 0.739602, "XOF": 587.59738, "XPF": 106.895986, "YER": 236.393102, "ZAR": 16.515529, "ZMW": 20.322629, "ZWG": 26.5466, "ZWL": 26.5466};
  function start(r, label) {
    rates = r; fillSelects(); statusEl.textContent = label;
    bodyEl.classList.remove("hidden"); render();
  }
  fetch("https://open.er-api.com/v6/latest/USD")
    .then((r) => r.json())
    .then((d) => { if (!d.rates) throw 0; start(d.rates, "آخر تحديث: " + new Date(d.time_last_update_unix * 1000).toLocaleDateString("ar")); })
    .catch(() => start(FALLBACK, "أسعار محفوظة بتاريخ 08 Nov 2026 (بدون اتصال)"));

  amountEl.addEventListener("input", render);
  fromEl.addEventListener("change", () => { fromEl.dataset.picked = fromEl.value; render(); });
  toEl.addEventListener("change", () => { toEl.dataset.picked = toEl.value; render(); });
  document.getElementById("swap").addEventListener("click", () => {
    const t = fromEl.value;
    fromEl.value = toEl.value;
    toEl.value = t;
    fromEl.dataset.picked = fromEl.value;
    toEl.dataset.picked = toEl.value;
    render();
  });
</script>
